[project]
name = "geometric-supervision"
version = "0.1.0"
description = "Code for Neural Geometry as a Learning Signal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "transformers==5.8.1",
    "numpy==2.3.4",
    "scipy==1.16.3",
    "pandas>=2.2",
    "matplotlib==3.11.1",
    "scikit-learn>=1.5",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "datasets==4.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "num2words==0.5.14"]
notebooks = ["jupyterlab>=4", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/months", "src/linebreak"]

[tool.uv]
index-url = "https://pypi.org/simple"

# torch wheels with CUDA 12.8 come from PyTorch's own index
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
